name: TEMP Human Build Freeze BS-P1-001

on:
  push:
    branches:
      - freeze/bs-p1-001

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Freeze branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main reference
        run: git fetch origin main

      - name: Checkout exact Freeze Audit PASS Design commit
        run: |
          DESIGN_ROOT="$RUNNER_TEMP/appf2-design"
          git init "$DESIGN_ROOT"
          git -C "$DESIGN_ROOT" remote add origin https://github.com/NFF98/appf2-design.git
          git -C "$DESIGN_ROOT" fetch --depth=1 origin 259f1e1b2277cf062611108c48112573ddc72cf0
          git -C "$DESIGN_ROOT" checkout --detach FETCH_HEAD

      - name: Generate locked BS-P1-001 and preflight gates
        env:
          DESIGN_ROOT: ${{ runner.temp }}/appf2-design
        run: node harness/tmp/freeze-bs-p1-001.mjs

      - name: Push generated Freeze commit
        run: git push origin HEAD:freeze/bs-p1-001
