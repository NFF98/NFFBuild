name: Automated Release

on:
  push:
    tags:
      - "REL-P*-*"

permissions:
  contents: read

concurrency:
  group: nff-production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: meta
        run: echo "release_id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Repository gates
        run: npm run gate
      - name: Product CI
        run: npm run product:ci
      - name: Validate release manifest
        run: node harness/scripts/validate-release.mjs --release "$GITHUB_REF_NAME"

  staging:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: npm run deploy -- --environment staging --release "$GITHUB_REF_NAME"
      - name: Staging smoke
        env:
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: npm run deploy:smoke -- --environment staging --release "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "staging-${{ github.ref_name }}"
          path: |
            .release-state/
            .deploy-output/

  production:
    needs: [validate, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: main
        run: npm run deploy -- --environment production --release "$GITHUB_REF_NAME"
      - name: Production smoke
        id: smoke
        env:
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: npm run deploy:smoke -- --environment production --release "$GITHUB_REF_NAME"
      - name: Automatic Cloudflare rollback on failed production verification
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: npm run deploy:rollback -- --environment production --release "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "production-${{ github.ref_name }}"
          path: |
            .release-state/
            .deploy-output/
