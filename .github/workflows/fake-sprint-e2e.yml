name: Fake Sprint E2E (Ephemeral)

on:
  pull_request:
    paths:
      - "harness/fake-sprint-e2e.mjs"
      - ".github/workflows/fake-sprint-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-sprint-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ephemeral full Fake Sprint
        run: node harness/fake-sprint-e2e.mjs
