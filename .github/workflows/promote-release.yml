name: Promote Release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Approved release ID, e.g. REL-P1-001
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full repository gate
        run: npm run gate
      - name: Product CI
        run: npm run product:ci
      - name: Validate approved release candidate
        run: node harness/scripts/validate-release.mjs --release "${{ inputs.release_id }}" --head "${{ github.sha }}"
      - name: Create immutable release trigger tag
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          git config user.name "NFF Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$RELEASE_ID" -m "Promote $RELEASE_ID"
          git push origin "$RELEASE_ID"
